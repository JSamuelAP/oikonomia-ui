name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure environment
        uses: ./.github/actions/configure-environment
        with:
          prime-ui-license: ${{ vars.PRIME_UI_LICENSE }}

      - name: Build
        run: npm run build

  docker:
    - name: Docker image
      needs: [quality, build]
      runs-on: ubuntu-latest
      environment: production

      steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Configure environment
          uses: ./.github/actions/configure-environment
          with:
            prime-ui-license: ${{ vars.PRIME_UI_LICENSE }}

        - name: Setup Docker buildx
          uses: docker/setup-buildx-action@v4

        - name: Build image
          uses: docker/build-push-action@v7
          with:
            context: .
            push: false
            load: true
            tags: oikonomia-ui:ci
            cache-from: type=gha
            cache-to: type=gha,mode=max

        - name: Smoke test
          run: |
            docker run -d --name web -p 8080:8080 -e API_UPSTREAM=http://127.0.0.1:8081 oikonomia-ui:ci
            for i in $(seq 1 20); do
              curl -fsS http://localhost:8080/healthz && break
              sleep 1
            done
            curl -fsS -o /dev/null http://localhost:8080/
            curl -fsS -o /dev/null http://localhost:8080/login
            curl -sI http://localhost:8080 | grep -i "x-content-type-options: nosniff"

        - name: Container logs
          if: failure()
          run: docker logs web
