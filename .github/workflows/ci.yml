name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PrimeUI license
        env:
          PRIME_UI_LICENSE: ${{ vars.PRIME_UI_LICENSE }}
        run: |
          if [ -z "$PRIME_UI_LICENSE" ]; then
            echo "PRIME_UI_LICENSE is not configured."
            exit 1
          fi

      - name: Configure PrimeUI license
        env:
          PRIME_UI_LICENSE: ${{ vars.PRIME_UI_LICENSE }}
        run: |
          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            primeUiLicense: '${PRIME_UI_LICENSE}'
          };
          EOF

      - name: Build
        run: npm run build
