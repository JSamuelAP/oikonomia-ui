<div class="grid grid-cols-1 md:grid-cols-2">
  <div class="relative hidden md:block">
    <img src="/images/auth/login-cover.jpg" alt="" class="absolute inset-0 h-full w-full object-cover" />
  </div>
  <div class="flex flex-col justify-center px-8 py-12 sm:px-12">
    <div class="maw-w-sm mx-auto w-full">
      <span class="block text-center text-2xl font-bold md:text-left">Oikonomía</span>
      <div class="mt-10 mb-8 text-center md:text-left">
        <h1 class="text-5xl font-bold">Bienvenido</h1>
        <p class="mt-1 text-sm">Ingresa tus datos para continuar</p>
      </div>
      <app-login-form [onSubmit]="handleLogin">
        <p footer class="text-center text-sm">
          ¿No tienes una cuenta?
          <a routerLink="/signup" class="text-primary-600 hover:text-primary-700 ml-1">Regístrate</a>
        </p>
      </app-login-form>
    </div>
  </div>
</div>
