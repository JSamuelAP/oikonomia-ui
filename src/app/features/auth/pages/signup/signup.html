<div class="grid grid-cols-1 md:grid-cols-2">
  <div class="relative hidden md:block">
    <img src="/images/auth/signup-cover.jpg" alt="" class="absolute inset-0 h-full w-full object-cover" />
  </div>
  <div class="flex flex-col justify-center px-8 py-12 sm:px-12">
    <div class="mx-auto w-full max-w-sm">
      <span class="block text-center text-2xl font-bold md:text-left">Oikonomía</span>
      <div class="mt-10 mb-8 text-center md:text-left">
        <h1 class="text-4xl font-bold">Crear cuenta</h1>
        <p class="mt-2 text-sm">Regístrate para empezar a usar Oikonomía</p>
      </div>
      <app-signup-form [onSubmit]="handleSignup">
        <p footer class="mt-6 text-center text-sm">
          ¿Ya tienes cuenta?
          <a routerLink="/login" class="text-primary-600 hover:text-primary-500 ml-1 font-medium">Inicia sesión</a>
        </p>
      </app-signup-form>
    </div>
  </div>
</div>
