<form [formRoot]="loginForm" class="flex flex-col gap-4">
  <div>
    <p-floatlabel variant="on">
      <input pInputText id="email" [formField]="loginForm.email" autocomplete="email" [fluid]="true" pSize="large" />
      <label for="email">Correo electrónico</label>
    </p-floatlabel>
    <app-field-errors [field]="loginForm.email" />
  </div>
  <div>
    <p-floatlabel variant="on">
      <input
        pInputPassword
        id="password"
        [formField]="loginForm.password"
        autocomplete="current-password"
        [fluid]="true"
        pSize="large"
      />
      <label for="password">Contraseña</label>
    </p-floatlabel>
    <app-field-errors [field]="loginForm.password" />
  </div>
  <app-field-errors [field]="loginForm" />
  <button pButton type="submit" [disabled]="loginForm().submitting()" size="large">
    @if (loginForm().submitting()) {
      Ingresando...
    } @else {
      Ingresar
    }
  </button>
  <ng-content select="[footer]" />
</form>
