<div class="flex w-72 flex-col gap-3 p-3">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
      <svg data-p-icon="shield" class="text-primary-500" style="width: 1.25rem; height: 1.25rem"></svg>
      <span class="text-sm font-semibold">Fortaleza</span>
    </div>
    <p-tag [severity]="severity()" [value]="label()" [style.visibility]="label() ? 'visible' : 'hidden'" />
  </div>
  <p-progressbar [value]="score()" [showValue]="false" [style]="{ height: '6px' }" [color]="progressbarColor()" />
  <ul class="m-0 flex list-none flex-col gap-2 p-0">
    @for (requeriment of requirements(); track requeriment.id) {
      <li class="flex items-center gap-2 text-xs">
        @if (requeriment.met) {
          <svg data-p-icon="check" class="text-green-500"></svg>
        } @else {
          <svg data-p-icon="times" class="text-red-400"></svg>
        }
        <span [class]="requeriment.met ? 'text-gray-600' : 'text-gray-400'">
          {{ requeriment.label }}
        </span>
      </li>
    }
  </ul>
</div>
