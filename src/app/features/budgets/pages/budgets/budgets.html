<div class="flex flex-col gap-6">
  <div class="flex flex-col justify-between gap-6 md:flex-row md:items-center">
    <h1 class="text-primary text-4xl font-bold">Presupuestos</h1>
    <app-month-picker [(selectedDate)]="currentMonth" [maxDate]="today" />
    <button pButton (click)="openCreateDialog()" size="large"><svg data-p-icon="plus"></svg> Nuevo presupuesto</button>
  </div>
  <app-budget-balance-summary
    [balance]="balance.value()"
    [overCount]="overCount()"
    [monthClosed]="monthClosed()"
    [loading]="balance.status() === 'loading'"
    [error]="balance.status() === 'error'"
    (retry)="balance.reload()"
  />
  <div class="bg-surface-0 border-surface mb-0.5 p-4 shadow-xs">
    <app-budget-table
      [budgets]="budgets.value()"
      [monthClosed]="monthClosed()"
      (show)="openViewDialog($event)"
      (create)="openCreateDialog()"
      (edit)="openEditDialog($event)"
      (delete)="openDeleteDialog($event)"
    />
  </div>
</div>

<p-dialog
  [visible]="viewDialogVisible()"
  (visibleChange)="!$event && closeViewDialog()"
  (onHide)="handleViewDialogHidden()"
  header="Detalles del presupuesto"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '30rem' }"
>
  <ng-template #content>
    @if (renderViewDialog()) {
      @if (budgetDetail.value(); as budget) {
        <app-budget-detail-view [budget]="budget" [monthClosed]="monthClosed()" />
      }
    }
  </ng-template>
</p-dialog>

<p-dialog
  [visible]="formDialogState() !== null"
  (visibleChange)="!$event && closeFormDialog()"
  [focusOnShow]="false"
  (onHide)="handleFormDialogHidden()"
  [header]="formDialogState()?.mode === 'edit' ? 'Editar presupuesto' : 'Nuevo presupuesto'"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '24rem' }"
>
  <ng-template #content>
    @if (renderedFormState(); as state) {
      <app-budget-form
        [initialValue]="state.mode === 'edit' ? state.budget : undefined"
        [categories]="categoryStore.categories.value()"
        [onSubmit]="state.mode === 'edit' ? handleUpdateBudget(state.budget.id) : handleCreateBudget"
        (canceled)="closeFormDialog()"
      />
    }
  </ng-template>
</p-dialog>

<p-confirmdialog />
