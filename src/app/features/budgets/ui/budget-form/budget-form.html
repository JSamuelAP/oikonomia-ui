<form [formRoot]="budgetForm" class="flex flex-col gap-4">
  <div class="pt-1">
    <p-floatlabel variant="on">
      <p-datepicker
        inputId="month"
        [formField]="budgetForm.month"
        view="month"
        dateFormat="MM yy"
        [maxDate]="DATE_MAX"
        [readonlyInput]="true"
        showIcon
        iconDisplay="input"
        size="large"
        fluid
      />
      <label for="month">Mes</label>
    </p-floatlabel>
    <app-field-errors [field]="budgetForm.month" />
  </div>
  <div>
    <app-category-select [formField]="budgetForm.categoryId" [categories]="categories()" />
    <app-field-errors [field]="budgetForm.categoryId" />
  </div>
  <div>
    <p-floatlabel variant="on">
      <p-inputnumber
        inputId="expectedAmount"
        [formField]="budgetForm.expectedAmount"
        pAutoFocus
        mode="currency"
        currency="MXN"
        locale="es-MX"
        [showButtons]="true"
        size="large"
        fluid
      />
      <label for="expectedAmount">Cantidad presupuestada</label>
    </p-floatlabel>
    <app-field-errors [field]="budgetForm.expectedAmount" />
  </div>
  <app-field-errors [field]="budgetForm" />
  <div class="mt-6 flex justify-end gap-2">
    <button pButton type="button" (click)="canceled.emit()" severity="secondary" variant="outlined" size="large">
      Cancelar
    </button>
    <button pButton type="submit" size="large">
      @if (budgetForm().submitting()) {
        <svg data-p-icon="spinner" class="animate-spin"></svg>
        Guardando...
      } @else {
        Guardar
      }
    </button>
  </div>
</form>
