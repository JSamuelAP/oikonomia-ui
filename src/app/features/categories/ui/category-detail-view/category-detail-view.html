<article>
  <div class="mb-8">
    <span class="font-display mb-1 block text-4xl font-bold">{{ category().name }}</span>
    <p-tag [severity]="flowTypeDisplay().severity">
      <svg [pIcon]="flowTypeDisplay().icon"></svg>
      {{ flowTypeDisplay().label }}
    </p-tag>
  </div>
  <app-audit-dates [createdAt]="category().createdAt" [updatedAt]="category().updatedAt" />
</article>
