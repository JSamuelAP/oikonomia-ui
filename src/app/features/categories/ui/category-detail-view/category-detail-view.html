<article>
  <div class="mb-8">
    <span class="font-display mb-1 block text-4xl font-bold">{{ category().name }}</span>
    <p-tag [severity]="flowTypeDisplay().severity">
      <svg [pIcon]="flowTypeDisplay().icon"></svg>
      {{ flowTypeDisplay().label }}
    </p-tag>
  </div>
  <div class="flex flex-col gap-0.5 text-sm">
    <div class="text-muted-color flex items-center gap-1">
      <svg data-p-icon="calendar"></svg>
      <span>Fecha de creación: {{ category().createdAt | date: formatDate(category().createdAt) }}</span>
    </div>
    <div class="text-muted-color flex items-center gap-1">
      <svg data-p-icon="calendar"></svg>
      <span>Última actualización: {{ category().updatedAt | date: formatDate(category().updatedAt) }}</span>
    </div>
  </div>
</article>
