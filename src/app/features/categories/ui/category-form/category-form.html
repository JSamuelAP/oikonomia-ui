<form [formRoot]="categoryForm" class="flex flex-col gap-4">
  <div class="pt-1">
    <p-floatlabel variant="on">
      <label for="name">Nombre</label>
      <input pInputText id="name" [formField]="categoryForm.name" autocomplete="off" [fluid]="true" pSize="large" />
    </p-floatlabel>
    <app-field-errors [field]="categoryForm.name" />
  </div>
  <div>
    <p-selectbutton
      [options]="flowTypeOptions"
      [formField]="categoryForm.flowType"
      optionValue="value"
      size="large"
      fluid
    >
      <ng-template #item let-item>
        <span class="p-selectbutton-item" [attr.data-value]="item.value">
          <i [class]="item.icon"></i>
          <span class="ml-1">{{ item.label }}</span>
        </span>
      </ng-template>
    </p-selectbutton>
    <app-field-errors [field]="categoryForm.flowType" />
  </div>
  <app-field-errors [field]="categoryForm" />
  <div class="mt-6 flex justify-end gap-2">
    <button pButton type="button" (click)="canceled.emit()" severity="secondary" variant="outlined" size="large">
      Cancelar
    </button>
    <button pButton type="submit" size="large">
      @if (categoryForm().submitting()) {
        <svg data-p-icon="spinner" class="animate-spin"></svg>
        Guardando...
      } @else {
        Guardar
      }
    </button>
  </div>
</form>
