<li class="mb-3 flex justify-between bg-gray-50 p-4">
  <span class="text-lg">{{ category().name }}</span>
  <div class="flex gap-4">
    <button pButton iconOnly rounded variant="text" aria-label="">
      <svg data-p-icon="eye" [size]="18"></svg>
    </button>
    <button pButton iconOnly rounded variant="text" aria-label="">
      <svg data-p-icon="pencil" [size]="18"></svg>
    </button>
    <button pButton iconOnly rounded variant="text" aria-label="">
      <svg data-p-icon="trash" [size]="18"></svg>
    </button>
  </div>
</li>
