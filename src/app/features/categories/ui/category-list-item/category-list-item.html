<li class="bg-surface-50 mb-3 flex justify-between rounded-md p-4">
  <span class="font-display text-xl font-bold">{{ category().name }}</span>
  <div class="flex gap-4">
    <button pButton iconOnly rounded variant="text" aria-label="">
      <svg data-p-icon="eye" [size]="18"></svg>
    </button>
    @if (false) {
      <button pButton (click)="handleEditClick()" iconOnly rounded variant="text" aria-label="">
        <svg data-p-icon="pencil" [size]="18"></svg>
      </button>
    }
    <button pButton iconOnly rounded variant="text" aria-label="">
      <svg data-p-icon="trash" [size]="18"></svg>
    </button>
  </div>
</li>
