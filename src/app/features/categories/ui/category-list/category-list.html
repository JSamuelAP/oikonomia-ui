<div class="bg-surface-0 rounded-border overflow-hidden shadow-sm">
  <div class="bg-emphasis flex items-center justify-between p-4">
    <div>
      <h2 class="text-primary text-3xl font-bold">{{ display().title }}</h2>
      <span class="text-accent text-sm font-normal">{{ display().subtitle }}</span>
    </div>
    <p-tag [severity]="display().severity" [value]="categories().length | i18nPlural: tagMap" />
  </div>
  <div class="p-4">
    <ul>
      @for (category of categories(); track category.id) {
        <app-category-list-item
          [category]="category"
          (show)="show.emit($event)"
          (edit)="edit.emit($event)"
          (delete)="delete.emit($event)"
        />
      } @empty {
        <p class="text-muted-color py-2 text-center">Aún no hay categorías, ¡comienza creando una!</p>
      }
    </ul>
  </div>
</div>
