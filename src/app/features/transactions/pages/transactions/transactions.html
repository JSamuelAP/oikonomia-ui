<div class="flex flex-col justify-between md:flex-row md:items-center">
  <h1 class="text-primary mt-4 mb-5 text-4xl font-bold">Transacciones</h1>
  <app-month-picker [(selectedDate)]="currentMonth" />
</div>
<div class="bg-surface-0 border-surface p-4">
  <app-transaction-table [transactions]="transactions.value()" (show)="openViewDialog($event)" />
</div>

<p-dialog
  [visible]="viewDialogVisible()"
  (visibleChange)="!$event && closeViewDialog()"
  (onHide)="handleViewDialogHidden()"
  header="Detalles de la transacción"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '30rem' }"
>
  <ng-template #content>
    @if (renderViewDialog()) {
      @if (transactionDetail.value(); as transaction) {
        <app-transaction-detail-view [transaction]="transaction" />
      }
    }
  </ng-template>
</p-dialog>
