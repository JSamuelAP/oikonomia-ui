<article>
  <div class="mb-6">
    <span class="font-display text-primary mb-2 block text-5xl font-bold">{{
      transaction().amount | currency: 'MXN'
    }}</span>
    <p-tag [severity]="flowTypeDisplay().severity">
      <svg [pIcon]="flowTypeDisplay().icon"></svg>
      {{ transaction().category.name }}
    </p-tag>
    <span class="text-accent mt-2 block">{{ transaction().date | date: "EEEE d 'de' MMMM 'de' yyyy" }}</span>
  </div>
  <div class="mb-8">
    <span class="text-muted-color text-sm">Notas</span>
    <p>{{ transaction().notes }}</p>
  </div>
  <app-audit-dates [createdAt]="transaction().createdAt" [updatedAt]="transaction().updatedAt" />
</article>
