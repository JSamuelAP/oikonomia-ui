<form [formRoot]="transactionForm" class="flex flex-col gap-4">
  <div class="pt-1">
    <p-floatlabel variant="on">
      <p-datepicker
        inputId="date"
        [formField]="transactionForm.date"
        dateFormat="D d 'de' M 'de' yy"
        [maxDate]="DATE_MAX"
        [readonlyInput]="true"
        showIcon
        iconDisplay="input"
        size="large"
        fluid
      />
      <label for="date">Fecha</label>
    </p-floatlabel>
    <app-field-errors [field]="transactionForm.date" />
  </div>
  <div>
    <p-floatlabel variant="on">
      <p-select
        inputId="category"
        [formField]="transactionForm.categoryId"
        [options]="groupedCategories()"
        [filter]="true"
        filterBy="label"
        [group]="true"
        size="large"
        fluid
      >
        <ng-template #dropdownicon>
          <svg data-p-icon="tags"></svg>
        </ng-template>
        <ng-template #selectedItem let-selectedOption>
          <div class="flex items-center gap-2">
            <svg [pIcon]="selectedOption.icon" [color]="`var(--${selectedOption.styleClass})`"></svg>
            <div>{{ selectedOption.label }}</div>
          </div>
        </ng-template>
        <ng-template let-item #item>
          <div class="flex items-center gap-2">
            <svg [pIcon]="item.icon" [color]="`var(--${item.styleClass})`"></svg>
            <div>{{ item.label }}</div>
          </div>
        </ng-template>
      </p-select>
      <label for="category">Categoría</label>
    </p-floatlabel>
    <app-field-errors [field]="transactionForm.categoryId" />
  </div>
  <div>
    <p-floatlabel variant="on">
      <p-inputnumber
        inputId="amount"
        [formField]="transactionForm.amount"
        pAutoFocus
        mode="currency"
        currency="MXN"
        locale="es-MX"
        [showButtons]="true"
        size="large"
        fluid
      />
      <label for="amount">Cantidad</label>
    </p-floatlabel>
    <app-field-errors [field]="transactionForm.amount" />
  </div>
  <div>
    <p-floatlabel variant="on">
      <textarea pTextarea id="notes" [formField]="transactionForm.notes" rows="3" pSize="large" fluid></textarea>
      <label for="notes">Notas</label>
    </p-floatlabel>
    <app-field-errors [field]="transactionForm.notes" />
  </div>
  <div class="mt-6 flex justify-end gap-2">
    <button pButton type="button" (click)="canceled.emit()" severity="secondary" variant="outlined" size="large">
      Cancelar
    </button>
    <button pButton type="submit" size="large">
      @if (transactionForm().submitting()) {
        <svg data-p-icon="spinner" class="animate-spin"></svg>
        Guardando...
      } @else {
        Guardar
      }
    </button>
  </div>
</form>
