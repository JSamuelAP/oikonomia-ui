<header class="flex h-16 items-center gap-4 rounded-2xl border border-gray-200 bg-white px-6">
  <button
    pButton
    type="button"
    (click)="menuToggle.emit()"
    iconOnly
    rounded
    variant="text"
    severity="secondary"
    class="lg:hidden!"
    aria-label="Abrir menú"
  >
    <svg data-p-icon="bars" [size]="24"></svg>
  </button>
  <div class="flex flex-1 items-center justify-end">
    <ng-content />
  </div>
</header>
