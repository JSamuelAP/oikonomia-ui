@if (open()) {
  <div
    class="fixed inset-0 z-30 bg-black/40 lg:hidden"
    (click)="closed.emit()"
    (keydown.enter)="closed.emit()"
    (keydown.space)="closed.emit()"
    tabindex="0"
    role="button"
    aria-label="Cerrar menú lateral"
  ></div>
}

<aside
  class="bg-surface-0 border-surface fixed inset-y-0 left-0 z-40 flex h-screen w-64 flex-col border-r transition-transform duration-200 ease-in-out lg:sticky lg:top-0 lg:translate-x-0"
  [class.-translate-x-full]="!open()"
  [class.translate-x-0]="open()"
>
  <nav class="flex-1 overflow-y-auto p-4 sm:pt-6">
    <a routerLink="/dashboard" class="mb-8 flex items-center">
      <span class="text-primary font-display self-center text-3xl font-bold whitespace-nowrap">Oikonomía</span>
    </a>
    <ul class="space-y-2 font-medium">
      @for (item of items; track item.label) {
        <li>
          <a href="#" class="hover:text-primary hover:bg-primary-50 rounded-border flex items-center p-2">
            <svg [pIcon]="item.icon" [size]="20"></svg>
            <span class="ms-3">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
