<p-avatar
  [label]="initials()"
  shape="circle"
  (click)="menu.toggle($event)"
  class="bg-primary-50! cursor-pointer select-none"
  [pt]="{ label: { class: 'text-primary' } }"
/>
<p-menu #menu [model]="items" [popup]="true">
  <ng-template #start>
    <div class="p-4 pb-2 text-sm">
      @let u = user();
      @if (u) {
        <div class="font-bold">{{ u.firstName }} {{ u.lastName }}</div>
        <div class="truncate">{{ u.email }}</div>
      }
    </div>
  </ng-template>
</p-menu>
